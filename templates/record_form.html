{% extends "base.html" %}
{% block title %}{{ title }} · MediShield AI{% endblock %}
{% block content %}
<h1 class="h4 mb-1">{{ title }}</h1>
<p class="text-muted">Patient: {{ patient.first_name }} {{ patient.last_name }} ({{ patient.mrn }})</p>
<div class="card"><div class="card-body">
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="record_type">Record type</label>
      <select class="form-select" id="record_type" name="record_type" required>
        {% for t in types %}
          <option value="{{ t }}" {% if values.get('record_type') == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="diagnosis">Diagnosis</label>
      <input type="text" class="form-control" id="diagnosis" name="diagnosis" maxlength="200"
             value="{{ values.get('diagnosis') or '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="treatment">Treatment</label>
      <textarea class="form-control" id="treatment" name="treatment" rows="2" maxlength="500">{{ values.get('treatment') or '' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label" for="notes">Notes</label>
      <textarea class="form-control" id="notes" name="notes" rows="4" maxlength="2000">{{ values.get('notes') or '' }}</textarea>
    </div>
    <p class="small text-muted">Use fictional sample data only.</p>
    <button type="submit" class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{{ url_for('patients.list_patients') }}">Cancel</a>
  </form>
</div></div>
{% endblock %}
